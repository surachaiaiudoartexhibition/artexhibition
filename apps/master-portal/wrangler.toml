name = "master-portal"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "master-db"
database_id = "a6867172-3457-4cc1-869c-0ae5e65e8dfd"

[vars]
# Secrets are NOT stored here. Set them on the Pages project (Settings > Variables and Secrets, type Secret)
# or with: npx wrangler pages secret put MASTER_ADMIN_KEY --project-name <project>
#   MASTER_ADMIN_KEY     master admin key
#   GLOBAL_SYNC_SECRET   optional; leave unset so only per-event tokens are accepted
