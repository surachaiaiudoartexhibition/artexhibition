# Cloudflare Pages Configuration for Event: Queen Sirikit Art Exhibition
# Dedicated Account Email: surachai.ai.udo@gmail.com

name = "sirikit"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# Isolated D1 Database for this Event
[[d1_databases]]
binding = "DB"
database_name = "art_event_1"
database_id = "e483980b-c034-448f-a1a3-9b61d392a13f"

[vars]
# Secrets are NOT stored here. Set them per Pages project (Settings > Variables and Secrets, type Secret)
# or with: npx wrangler pages secret put ADMIN_KEY --project-name <project>
#   ADMIN_KEY            curator admin key
#   SHARED_SECRET_TOKEN  Bearer token sent to Master /api/sync (must match registered_events.secret_token)
EVENT_ID = "sirikit"
EVENT_TITLE = "Queen Sirikit Art Exhibition"
ADMIN_EMAIL = "surachai.ai.udo@gmail.com"
MASTER_PORTAL_URL = "https://artexhibition.pages.dev"
EVENT_PAGE_BASE_URL = "https://sirikit.pages.dev"
EVENT_THEME = "heritage"

# Dedicated Cloudinary Storage Account for this Event
CLOUDINARY_CLOUD_NAME = "wxpyhu4c"
CLOUDINARY_UPLOAD_PRESET = "sirikit"
