<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ห้องจัดแสดงนิทรรศการ | Virtual Exhibition Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-full flex flex-col selection:bg-indigo-500 selection:text-white">
  <!-- Navbar -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
          VE
        </div>
        <div>
          <span id="nav-event-title" class="text-sm font-semibold tracking-wide text-white block">Printmaking Exhibition</span>
          <span class="text-[11px] text-indigo-400 font-mono">Virtual Gallery</span>
        </div>
      </a>
      <nav class="flex items-center space-x-3 sm:space-x-6 text-sm font-medium">
        <a href="/" class="text-slate-300 hover:text-white transition">หน้าแรก</a>
        <a href="/gallery.html" class="text-white font-semibold">ชมนิทรรศการ</a>
        <a href="/submit.html" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-md shadow-indigo-600/20 transition">ส่งผลงาน</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <!-- Header & Filter Bar -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">ห้องจัดแสดงนิทรรศการ</h1>
        <p class="text-slate-400 text-sm mt-1">ผลงานศิลปะที่ได้รับการคัดเลือกและจัดแสดงในงานนี้</p>
      </div>

      <div class="flex items-center gap-3">
        <div class="relative w-full md:w-72">
          <input type="text" id="search-input" placeholder="ค้นหาตามชื่อผลงาน หรือศิลปิน..."
            class="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0118 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div id="artworks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Loading State -->
      <div class="glass-card rounded-2xl p-4 animate-pulse">
        <div class="aspect-[4/3] bg-slate-800 rounded-xl mb-3"></div>
        <div class="h-4 bg-slate-800 rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
      <div class="glass-card rounded-2xl p-4 animate-pulse">
        <div class="aspect-[4/3] bg-slate-800 rounded-xl mb-3"></div>
        <div class="h-4 bg-slate-800 rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
      <div class="glass-card rounded-2xl p-4 animate-pulse hidden lg:block">
        <div class="aspect-[4/3] bg-slate-800 rounded-xl mb-3"></div>
        <div class="h-4 bg-slate-800 rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-900 bg-slate-950 py-8 text-center text-xs text-slate-500">
    <p>Multi-Tenant Virtual Exhibition System &bull; Zero-Budget Architecture</p>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    let allArtworks = [];

    document.addEventListener("DOMContentLoaded", async () => {
      const config = await EventAPI.getConfig();
      if (config.eventTitle) {
        document.getElementById("nav-event-title").textContent = config.eventTitle;
      }

      await loadArtworks();

      document.getElementById("search-input").addEventListener("input", (e) => {
        renderArtworks(e.target.value.toLowerCase().trim());
      });
    });

    async function loadArtworks() {
      try {
        const res = await EventAPI.getSubmissions("approved");
        allArtworks = res.submissions || [];
        renderArtworks("");
      } catch (err) {
        console.error("Failed to load artworks", err);
        document.getElementById("artworks-grid").innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-400">
            ไม่สามารถโหลดผลงานได้ กรุณาลองใหม่อีกครั้ง
          </div>
        `;
      }
    }

    function renderArtworks(searchTerm) {
      const container = document.getElementById("artworks-grid");
      container.innerHTML = "";

      const filtered = allArtworks.filter(art => {
        if (!searchTerm) return true;
        return (art.title && art.title.toLowerCase().includes(searchTerm)) ||
               (art.artist_name && art.artist_name.toLowerCase().includes(searchTerm));
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 glass-card rounded-2xl">
            <svg class="w-12 h-12 text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <p class="text-slate-400 font-medium">ไม่พบผลงานที่ตรงกับคำค้นหา</p>
            <a href="/submit.html" class="inline-block mt-3 text-sm text-indigo-400 hover:underline">ส่งผลงานเข้าร่วมนิทรรศการ</a>
          </div>
        `;
        return;
      }

      filtered.forEach(art => {
        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl overflow-hidden hover:border-indigo-500/60 transition group flex flex-col";
        card.innerHTML = `
          <div class="relative aspect-[4/3] bg-slate-900 overflow-hidden cursor-pointer">
            <a href="/artwork.html?id=${art.id}">
              <img src="${art.thumbnail_url || art.image_url}" alt="${art.title}" 
                   class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
            </a>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <a href="/artwork.html?id=${art.id}">
                <h3 class="text-base font-bold text-white group-hover:text-indigo-300 transition truncate">${art.title}</h3>
              </a>
              <p class="text-xs text-slate-400 mt-0.5">โดย <span class="text-slate-200">${art.artist_name}</span></p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
              <span class="text-[11px] text-slate-500 font-mono">ID: #${art.id}</span>
              <a href="/artwork.html?id=${art.id}" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition flex items-center gap-1">
                <span>ชมผลงาน</span>
                <span>&rarr;</span>
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
