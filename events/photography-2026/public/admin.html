<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curator Dashboard | ระบบจัดการผลงานและ Webhook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-full flex flex-col selection:bg-indigo-500 selection:text-white">
  <!-- Navbar -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
          VE
        </div>
        <div>
          <span id="nav-event-title" class="text-sm font-semibold tracking-wide text-white block">Event Moderation</span>
          <span class="text-[11px] text-amber-400 font-mono">Curator & Webhook Dispatch</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-xs">
          <span class="text-slate-400">Admin Key:</span>
          <input type="password" id="admin-key-input" value="admin123" class="bg-transparent border-none text-white focus:outline-none w-24 font-mono">
        </div>
        <a href="/gallery.html" class="text-xs text-indigo-400 hover:text-white transition">ชมนิทรรศการ</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Header with Stats -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white">ตรวจสอบและตรวจรับผลงาน (Curation)</h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">
          เมื่อกดอนุมัติ (Approve) ระบบจะอัปเดตสถานะใน D1 ประจำงาน และส่ง Webhook ข้อมูลไปยัง Master Portal อัตโนมัติ
        </p>
      </div>
      <button onclick="loadDashboardSubmissions()" class="self-start md:self-auto px-4 py-2 rounded-xl glass-card hover:bg-slate-800 text-xs font-semibold text-slate-300 transition flex items-center gap-2">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        รีเฟรชข้อมูล
      </button>
    </div>

    <!-- Status Tabs -->
    <div class="flex border-b border-slate-800 mb-6 gap-2 sm:gap-6 text-sm">
      <button onclick="switchTab('pending')" id="tab-pending" class="pb-3 font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2">
        <span>รอการตรวจสอบ (Pending)</span>
        <span id="badge-count-pending" class="px-2 py-0.5 rounded-full text-xs bg-amber-500/20 text-amber-300 font-mono">0</span>
      </button>
      <button onclick="switchTab('approved')" id="tab-approved" class="pb-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2">
        <span>อนุมัติแล้ว (Approved)</span>
        <span id="badge-count-approved" class="px-2 py-0.5 rounded-full text-xs bg-emerald-500/20 text-emerald-300 font-mono">0</span>
      </button>
      <button onclick="switchTab('rejected')" id="tab-rejected" class="pb-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2">
        <span>ปฏิเสธ (Rejected)</span>
        <span id="badge-count-rejected" class="px-2 py-0.5 rounded-full text-xs bg-rose-500/20 text-rose-300 font-mono">0</span>
      </button>
      <button onclick="switchTab('')" id="tab-all" class="pb-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-white">
        ทั้งหมด
      </button>
    </div>

    <!-- Toast / Notification container -->
    <div id="toast-container" class="mb-6 hidden"></div>

    <!-- Submissions List -->
    <div id="submissions-list" class="space-y-4">
      <div class="glass-card rounded-2xl p-8 text-center text-slate-500">
        กำลังโหลดรายการผลงาน...
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    let currentTab = "pending";
    let allLoadedSubmissions = [];

    document.addEventListener("DOMContentLoaded", async () => {
      const config = await EventAPI.getConfig();
      if (config.eventTitle) {
        document.getElementById("nav-event-title").textContent = config.eventTitle;
      }
      loadDashboardSubmissions();
    });

    function getAdminKey() {
      return document.getElementById("admin-key-input").value.trim();
    }

    function switchTab(tab) {
      currentTab = tab;
      ["pending", "approved", "rejected", ""].forEach(t => {
        const btn = document.getElementById(`tab-${t || "all"}`);
        if (t === tab) {
          btn.className = "pb-3 font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2";
        } else {
          btn.className = "pb-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2";
        }
      });
      renderSubmissions();
    }

    async function loadDashboardSubmissions() {
      const listContainer = document.getElementById("submissions-list");
      listContainer.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-400 animate-pulse">กำลังดึงข้อมูล...</div>`;

      try {
        // Fetch all using admin key
        const res = await EventAPI.getSubmissions("", getAdminKey());
        allLoadedSubmissions = res.submissions || [];

        // Update counts
        const pendingCount = allLoadedSubmissions.filter(s => s.status === "pending").length;
        const approvedCount = allLoadedSubmissions.filter(s => s.status === "approved").length;
        const rejectedCount = allLoadedSubmissions.filter(s => s.status === "rejected").length;

        document.getElementById("badge-count-pending").textContent = pendingCount;
        document.getElementById("badge-count-approved").textContent = approvedCount;
        document.getElementById("badge-count-rejected").textContent = rejectedCount;

        renderSubmissions();
      } catch (err) {
        listContainer.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-rose-400">
            เกิดข้อผิดพลาดในการโหลด: ${err.message}
          </div>
        `;
      }
    }

    function renderSubmissions() {
      const listContainer = document.getElementById("submissions-list");
      listContainer.innerHTML = "";

      const filtered = allLoadedSubmissions.filter(s => {
        if (!currentTab) return true;
        return s.status === currentTab;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="glass-card rounded-2xl p-12 text-center text-slate-500">
            ไม่มีผลงานในสถานะนี้ (${currentTab || "ทั้งหมด"})
          </div>
        `;
        return;
      }

      filtered.forEach(sub => {
        const item = document.createElement("div");
        item.className = "glass-card rounded-2xl p-5 sm:p-6 flex flex-col md:flex-row gap-6 items-start";
        
        let statusBadge = "";
        if (sub.status === "pending") {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">รอการตรวจสอบ</span>`;
        } else if (sub.status === "approved") {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">อนุมัติแล้ว</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">ปฏิเสธ</span>`;
        }

        item.innerHTML = `
          <div class="w-full md:w-48 h-40 flex-shrink-0 bg-slate-900 rounded-xl overflow-hidden relative">
            <img src="${sub.thumbnail_url || sub.image_url}" alt="${sub.title}" class="w-full h-full object-cover">
            <span class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[11px] font-mono text-slate-300">#${sub.id}</span>
          </div>

          <div class="flex-1 space-y-2">
            <div class="flex items-center gap-3">
              ${statusBadge}
              <span class="text-xs text-slate-500 font-mono">${sub.created_at ? new Date(sub.created_at).toLocaleString("th-TH") : ""}</span>
            </div>
            <h3 class="text-lg font-bold text-white">${sub.title}</h3>
            <p class="text-sm text-indigo-300">ศิลปิน: <span class="text-white font-medium">${sub.artist_name}</span></p>
            <p class="text-xs text-slate-400 line-clamp-2">${sub.description || "ไม่มีคำอธิบาย"}</p>
            <div class="pt-2 text-[11px] text-slate-500 font-mono truncate">
              Media: <a href="${sub.image_url}" target="_blank" class="hover:text-indigo-400 underline">${sub.image_url}</a>
            </div>
          </div>

          <div class="w-full md:w-auto flex md:flex-col gap-2.5 justify-end">
            ${sub.status !== "approved" ? `
              <button onclick="approveArtwork(${sub.id})" class="flex-1 md:flex-initial px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span>อนุมัติ & Push Webhook</span>
              </button>
            ` : `
              <a href="/artwork.html?id=${sub.id}" target="_blank" class="px-4 py-2 rounded-xl glass-card hover:bg-slate-800 text-slate-200 text-xs font-medium text-center transition">
                ดูหน้าผลงานจริง &nearr;
              </a>
            `}

            ${sub.status !== "rejected" ? `
              <button onclick="rejectArtwork(${sub.id})" class="flex-1 md:flex-initial px-4 py-2 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-medium transition flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span>ปฏิเสธ</span>
              </button>
            ` : ""}
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    async function approveArtwork(id) {
      if (!confirm(`ยืนยันการอนุมัติผลงาน #${id} และส่ง Webhook ไปยัง Master Portal หรือไม่?`)) return;

      try {
        const res = await EventAPI.approveArtwork(id, getAdminKey());
        if (res.success) {
          const webhook = res.webhook;
          let webhookMsg = "";
          if (webhook.syncResult.attempted) {
            if (webhook.syncResult.success) {
              webhookMsg = ` | Webhook ส่งไปยังเว็บท่าสำเร็จ (Status ${webhook.syncResult.status})`;
            } else {
              webhookMsg = ` | Webhook ล้มเหลว (${webhook.syncResult.error || "Status " + webhook.syncResult.status})`;
            }
          } else {
            webhookMsg = ` (ยังไม่ได้กำหนด MASTER_PORTAL_URL หรือ SHARED_SECRET_TOKEN)`;
          }

          showToast(`อนุมัติผลงาน #${id} เรียบร้อยแล้ว${webhookMsg}`, "success");
          loadDashboardSubmissions();
        } else {
          alert(`เกิดข้อผิดพลาด: ${res.error}`);
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาด: ${err.message}`);
      }
    }

    async function rejectArtwork(id) {
      if (!confirm(`ต้องการปฏิเสธผลงาน #${id} ใช่หรือไม่?`)) return;

      try {
        const res = await EventAPI.rejectArtwork(id, getAdminKey());
        if (res.success) {
          showToast(`ปฏิเสธผลงาน #${id} แล้ว`, "info");
          loadDashboardSubmissions();
        } else {
          alert(`เกิดข้อผิดพลาด: ${res.error}`);
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาด: ${err.message}`);
      }
    }

    function showToast(message, type = "success") {
      const toast = document.getElementById("toast-container");
      toast.classList.remove("hidden");
      const bg = type === "success" ? "bg-emerald-950/80 border-emerald-500/40 text-emerald-300" : "bg-indigo-950/80 border-indigo-500/40 text-indigo-300";
      toast.innerHTML = `
        <div class="p-4 rounded-xl border ${bg} text-sm flex items-center justify-between">
          <span>${message}</span>
          <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="text-xs opacity-70 hover:opacity-100">&times;</button>
        </div>
      `;
    }
  </script>
</body>
</html>
